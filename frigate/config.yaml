---
name: Frigate NVR (elFrigate)
version: "0.17.0"
slug: frigate
description: >
  Frigate NVR – nagrywanie i detekcja obiektów AI z YOLOv9 ONNX 640×640.
  Obsługuje RTSP/RTMP/HTTP kamery i integruje się z Home Assistant przez MQTT.
url: https://github.com/m-rodak/elFrigate
arch:
  - aarch64
  - amd64
init: false
privileged:
  - SYS_PTRACE
full_access: false
homeassistant_api: false
hassio_api: false
host_network: false
map:
  - config:rw
  - media:rw
  - share:rw
ports:
  5000/tcp: 5000   # Frigate Web UI
  8554/tcp: 8554   # RTSP Restream
  8555/tcp: 8555   # WebRTC
  8555/udp: 8555   # WebRTC UDP
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: str
tmpfs:
  size: 512mb
  medium: memory
